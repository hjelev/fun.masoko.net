<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a6dde0">

  {%- if page.joke_title -%}
    {%- assign ttl = page.joke_title | append: " — " | append: site.title -%}
  {%- elsif page.title -%}
    {%- assign ttl = page.title | append: " — " | append: site.title -%}
  {%- else -%}
    {%- assign ttl = site.title -%}
  {%- endif -%}
  <title>{{ ttl }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400..800&family=Sofia+Sans+Extra+Condensed:wght@800..900&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/logo.png' | relative_url }}">

  <!-- Apply theme before paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  {% seo %}

  <script defer src="https://m.masoko.net/core-util" data-website-id="2ff40fed-572a-4bf9-af7a-ff25be41a229"></script>
</head>
