{%- assign groups = site.jokes | group_by: "category" -%}
<nav class="chips" aria-label="Категории">
  <a class="chip{% unless page.category %} is-active{% endunless %}" href="{{ '/' | relative_url }}">Всички <span class="count">{{ site.jokes | size }}</span></a>
  {% for c in site.data.categories %}
    {%- assign g = groups | where: "name", c.slug | first -%}
    {% if g %}
    <a class="chip{% if page.category == c.slug %} is-active{% endif %}" data-cat="{{ c.slug }}" href="{{ '/c/' | append: c.slug | append: '/' | relative_url }}"><span class="chip-emoji" aria-hidden="true">{{ c.emoji }}</span> {{ g.items[0].category_name }} <span class="count">{{ g.items | size }}</span></a>
    {% endif %}
  {% endfor %}
</nav>
